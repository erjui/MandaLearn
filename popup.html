<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Subtitle Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #667eea;
        }

        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 16px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .section {
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .language-option {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 6px;
            background: #f9f9f9;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .language-option:hover {
            background: #f0f0f0;
        }

        .language-option input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .language-label {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .language-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .language-code {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .order-indicator {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            min-width: 20px;
            text-align: right;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 3px solid #2196f3;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #1565c0;
            margin-top: 16px;
        }

        .status {
            text-align: center;
            margin-top: 12px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status.active {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.inactive {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MandaLearn</h1>
        <p class="subtitle">Learn Chinese with multi-layer subtitles</p>

        <div class="toggle-container">
            <span class="toggle-label">Enable Extension</span>
            <label class="toggle-switch">
                <input type="checkbox" id="enableToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="section">
            <div class="section-title">Select Languages (in order)</div>
            
            <label class="language-option">
                <input type="checkbox" class="lang-checkbox" data-lang="english" data-code="en">
                <div class="language-label">
                    <span class="language-name">English</span>
                    <span class="language-code">Primary translation</span>
                </div>
                <span class="order-indicator" id="order-english"></span>
            </label>

            <label class="language-option">
                <input type="checkbox" class="lang-checkbox" data-lang="pinyin" data-code="zh-pinyin">
                <div class="language-label">
                    <span class="language-name">Pinyin</span>
                    <span class="language-code">Chinese (Pinyin style)</span>
                </div>
                <span class="order-indicator" id="order-pinyin"></span>
            </label>

            <label class="language-option">
                <input type="checkbox" class="lang-checkbox" data-lang="chinese" data-code="zh-Hans">
                <div class="language-label">
                    <span class="language-name">简体中文</span>
                    <span class="language-code">Simplified Chinese</span>
                </div>
                <span class="order-indicator" id="order-chinese"></span>
            </label>
        </div>

        <div class="info-box">
            💡 Select subtitle layers to help you learn Chinese. Choose English for meaning, Pinyin for pronunciation, and Chinese characters to build reading skills.
        </div>

        <div class="status active" id="status">
            ✓ Extension Active
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
